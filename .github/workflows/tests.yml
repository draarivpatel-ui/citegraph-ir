name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --test test/

  python:
    name: command line interface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 cli/eval_ir.py
      - run: python3 cli/eval_ir.py --queries
      - run: python3 cli/eval_ir.py --sweep
      - run: python3 cli/eval_ir.py --unanswerable --roc
